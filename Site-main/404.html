<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page Not Found</title>
  <meta name="description" content="Page not found — Darsh Singhee's site" />
  <link rel="stylesheet" href="src/styles.css" />
  <!-- 404 layout styles moved to src/styles.css -->
</head>
<body>
  <main class="error-hero">
    <div class="container">
      <div class="error-card" role="article" aria-labelledby="err-title">
        <div class="error-illustration" aria-hidden="true">
          <!-- Playful astronaut SVG matching site gradient and style -->
          <svg class="astro" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#2563eb"/>
                <stop offset="60%" stop-color="#3b82f6"/>
                <stop offset="100%" stop-color="#60a5fa"/>
              </linearGradient>
              <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="b"/>
                <feBlend in="SourceGraphic" in2="b"/>
              </filter>
            </defs>
            <rect width="200" height="200" rx="24" fill="url(#g1)" opacity="0.06"/>
            <g transform="translate(20,12)">
              <circle cx="80" cy="80" r="46" fill="#fff" opacity="0.95" stroke="rgba(37,99,235,0.06)" stroke-width="4"/>
              <g transform="translate(52,50)">
                <rect x="-18" y="-6" width="36" height="26" rx="6" fill="url(#g1)"/>
                <circle cx="0" cy="0" r="10" fill="#fff"/>
              </g>
              <g transform="translate(12,28)">
                <path d="M4 92c18-6 40-8 60-4" stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"></path>
                <path d="M132 116c-18-6-40-8-60-4" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"></path>
              </g>
            </g>
            <g transform="translate(0,0)" class="svg-filtered">
              <circle cx="30" cy="30" r="12" fill="#2563eb"/>
              <circle cx="170" cy="160" r="8" fill="#3b82f6"/>
            </g>
          </svg>
        </div>

        <div class="error-content">
          <div class="error-code" aria-hidden="true">404</div>
          <h1 id="err-title" class="error-title">Woops — That page is lost in space</h1>
          <p class="error-desc">We couldn't find the page you're looking for. It may have moved, been deleted, or you typed the address wrong. Here are some helpful places to continue exploring.</p>

          <div class="error-actions">
            <a href="index.html" class="btn btn-primary" title="Go back home">Take me home</a>
            <a href="index.html#contact" class="btn btn-secondary">Contact</a>
            <a href="" id="reportBtn" class="btn btn-report">Report issue</a>
          </div>

          <p class="tip-text">Tip: Press <strong>Esc</strong> to go back, or use the navigation above.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Small interactive helpers for the 404 page
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.location.href = 'index.html';
    });

    document.getElementById('reportBtn').addEventListener('click', (ev) => {
      ev.preventDefault();
      // Open user's mail client to report the broken link
      const subject = encodeURIComponent('Broken link report — 404 on Darsh site');
      const body = encodeURIComponent('Hi Darsh,%0D%0A%0D%0AI found a broken link on the site. Please check the URL:%0D%0A' + window.location.href);
      window.location.href = `mailto:singhee.darsh@gmail.com?subject=${subject}&body=${body}`;
    });
  </script>

  <script type="module" src="src/script.js"></script>
</body>
</html>
