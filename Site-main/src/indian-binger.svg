<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="300" fill="#5c2e1a"/>
  
  <!-- Decorative border -->
  <rect x="0" y="0" width="500" height="300" fill="none" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Title: INDIAN BINGER -->
  <text x="250" y="110" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#d4af37" text-anchor="middle">INDIAN BINGER</text>
  
  <!-- Subtitle: SMALL BITES, BIG SPICE -->
  <text x="250" y="160" font-family="Georgia, serif" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">SMALL BITES, BIG SPICE</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="250" r="8" fill="#d4af37"/>
  <circle cx="420" cy="250" r="8" fill="#d4af37"/>
  <line x1="100" y1="250" x2="400" y2="250" stroke="#d4af37" stroke-width="2"/>
</svg>